<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#0f172a;
    color:#e5e7eb;
    font-family:Arial, sans-serif;
    padding:25px 16px;
}

.card{
    width:100%;
    max-width:560px;
    margin:20px auto;
    background:#1e293b;
    padding:32px 24px;
    border-radius:24px;
    border:1px solid #334155;
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
}

/* Profile image */
#preview{
    display:block;
    width:140px;
    height:140px;
    margin:0 auto 25px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #3b82f6;
    box-shadow:0 0 20px rgba(59,130,246,0.35);
}

h2{
    margin:0 0 25px;
    text-align:center;
    font-size:28px;
    color:#f8fafc;
}

/* Form layout */
form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

input[type="text"],
textarea{
    width:100%;
    margin:0;
    background:#0f172a;
    color:#f8fafc;
    border:1px solid #475569;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    outline:none;
    font-family:Arial, sans-serif;
}

input[type="text"]:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

textarea{
    height:110px;
    resize:none;
}

/* Buttons */
button{
    width:100%;
    margin:4px 0 10px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:active{
    transform:scale(0.98);
}

/* File upload */
input[type="file"]{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#0f172a;
    color:#cbd5e1;
    border:1px dashed #475569;
    border-radius:14px;
    font-size:14px;
}

/* Hide unnecessary old line breaks */
br{
    display:none;
}

@media(max-width:480px){
    body{
        padding:16px;
    }

    .card{
        margin:10px auto;
        padding:28px 18px;
        border-radius:20px;
    }

    #preview{
        width:125px;
        height:125px;
    }

    h2{
        font-size:25px;
    }
}

.profile-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-bottom:24px;
    margin-bottom:22px;
    border-bottom:1px solid #334155;
}

.profile-title span{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
    color:#60a5fa;
    margin-bottom:8px;
}

.profile-title h2{
    margin:0;
}

.profile-title p{
    margin:8px 0 0;
    color:#94a3b8;
    font-size:14px;
}

label{
    color:#cbd5e1;
    font-size:13px;
    font-weight:bold;
    margin:4px 0 -4px 4px;
}

.upload-section{
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid #334155;
}

.upload-heading h3{
    margin:0;
    color:#f8fafc;
    font-size:17px;
}

.upload-heading p{
    margin:6px 0 14px;
    color:#94a3b8;
    font-size:13px;
}

.profile-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.profile-nav span{
    font-size:17px;
    font-weight:bold;
    color:#f8fafc;
}

.back-btn{
    width:42px;
    height:42px;
    margin:0;
    padding:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f172a;
    border:1px solid #334155;
    color:#f8fafc;
    font-size:24px;
    line-height:1;
}

.back-btn:active{
    transform:scale(0.92);
    background:#2563eb;
}

.nav-space{
    width:42px;
}

.upload-box{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.upload-box input[type="file"]{
    display:none;
}

.custom-file-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    box-sizing:border-box;
    background:#172033;
    border:1px dashed #475569;
    border-radius:12px;
    color:#cbd5e1;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.custom-file-btn:active{
    transform:scale(0.98);
    border-color:#3b82f6;
    background:#1e293b;
}

#file-name{
    display:block;
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}


/* =========================================================
   LUCKY CHAT — PROFILE V2 POLISH
   Interface-only upgrade; existing form actions preserved.
   ========================================================= */

:root{
    --bg:#0b1220;
    --card:#182438;
    --card-deep:#101a2b;
    --input:#0d1728;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(148,163,184,.12);
    --blue:#3b82f6;
    --blue2:#60a5fa;
}

body{
    background:
        radial-gradient(circle at 50% -12%,rgba(59,130,246,.18),transparent 34%),
        radial-gradient(circle at 0% 45%,rgba(37,99,235,.06),transparent 28%),
        var(--bg);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    padding:14px 12px 34px;
}

.card{
    max-width:560px;
    margin:8px auto;
    padding:0;
    overflow:hidden;
    background:rgba(24,36,56,.97);
    border:1px solid var(--border);
    border-radius:25px;
    box-shadow:0 24px 70px rgba(0,0,0,.34);
}

.profile-nav{
    height:62px;
    padding:0 18px;
    margin:0;
    background:rgba(15,23,42,.46);
    border-bottom:1px solid var(--border);
}

.profile-nav span{
    font-size:16px;
    letter-spacing:.1px;
}

.back-btn{
    width:40px;
    height:40px;
    border-radius:13px;
    background:#101a2b;
    border:1px solid rgba(148,163,184,.12);
    box-shadow:none;
    transition:transform .16s ease,background .16s ease;
}

.back-btn:active{
    transform:scale(.92);
    background:#2563eb;
}

.nav-space{
    width:40px;
}

.profile-top{
    position:relative;
    padding:30px 22px 25px;
    margin:0;
    background:
        linear-gradient(180deg,rgba(37,99,235,.10),transparent 82%),
        rgba(17,27,45,.42);
    border-bottom:1px solid var(--border);
}

.profile-top::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 8%,rgba(96,165,250,.10),transparent 38%);
}

#preview{
    position:relative;
    width:116px;
    height:116px;
    margin:0 auto 17px;
    padding:3px;
    border:3px solid var(--blue);
    background:#0f172a;
    box-shadow:
        0 0 0 5px rgba(59,130,246,.08),
        0 12px 32px rgba(0,0,0,.30);
    transition:transform .18s ease;
}

#preview:active{
    transform:scale(.97);
}

.profile-title{
    position:relative;
}

.profile-title span{
    color:var(--blue2);
    font-size:10px;
    letter-spacing:3px;
}

.profile-title h2{
    margin:0;
    font-family:Georgia,serif;
    font-size:25px;
    line-height:1.15;
}

.profile-title p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
}

.card > form{
    padding:22px 22px 20px;
    gap:11px;
}

label{
    margin:3px 0 -2px 3px;
    color:#cbd5e1;
    font-size:12px;
    font-weight:700;
}

input[type="text"],
textarea{
    background:var(--input);
    border:1px solid rgba(148,163,184,.14);
    border-radius:13px;
    padding:13px 14px;
    transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}

input[type="text"]{
    height:48px;
}

textarea{
    min-height:96px;
    height:96px;
}

input[type="text"]:focus,
textarea:focus{
    background:#0f1b2e;
    border-color:rgba(96,165,250,.58);
    box-shadow:0 0 0 4px rgba(59,130,246,.08);
}

button{
    min-height:48px;
    margin:4px 0 3px;
    border-radius:13px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    box-shadow:0 8px 22px rgba(37,99,235,.18);
    transition:transform .16s ease,filter .16s ease;
}

button:hover{
    filter:brightness(1.05);
}

button:active{
    transform:scale(.985);
}

.upload-section{
    margin:0;
    padding:22px;
    background:rgba(13,23,40,.22);
    border-top:1px solid var(--border);
}

.upload-heading h3{
    font-size:16px;
}

.upload-heading p{
    font-size:12px;
}

.upload-box{
    gap:9px;
}

.custom-file-btn{
    height:50px;
    border-radius:13px;
    background:#101a2b;
    border-color:rgba(148,163,184,.22);
    transition:background .18s ease,border-color .18s ease,transform .16s ease;
}

.custom-file-btn:active{
    transform:scale(.985);
    border-color:#3b82f6;
    background:#17243a;
}

#file-name{
    padding:0 8px;
}

.upload-section button{
    margin-top:12px;
}

@media(max-width:480px){
    body{
        padding:8px 8px 26px;
    }

    .card{
        margin:4px auto;
        border-radius:22px;
    }

    .profile-nav{
        padding:0 14px;
    }

    .profile-top{
        padding:27px 17px 23px;
    }

    #preview{
        width:108px;
        height:108px;
    }

    .card > form{
        padding:20px 17px 18px;
    }

    .upload-section{
        padding:20px 17px;
    }
}

</style>

</head>
<body>

<div class="card">

<div class="profile-nav">
    <button type="button" class="back-btn" onclick="history.back()">
        ←
    </button>

    <span>Edit Profile</span>

    <div class="nav-space"></div>
</div>

    <div class="profile-top">
        <img src="{{ user.profile_picture }}" id="preview">

        <div class="profile-title">
            <span>PROFILE</span>
            <h2>{{ user.display_name or user.username }}</h2>
            <p>Manage your personal information</p>
        </div>
    </div>

    <form action="/update-profile" method="post">

        <label>Display Name</label>
        <input
            type="text"
            name="display_name"
            placeholder="Display name"
            value="{{ user.display_name or '' }}"
            maxlength="30">

        <label>Bio</label>
        <textarea
            name="bio"
            placeholder="Write something about yourself..."
            maxlength="150">{{ user.bio or '' }}</textarea>

        <button type="submit">Save Changes</button>

    </form>

    <div class="upload-section">
        <div class="upload-heading">
            <h3>Profile Picture</h3>
            <p>Choose a new image for your profile</p>
        </div>

        <form action="/upload-profile" method="post" enctype="multipart/form-data">

        <div class="upload-box">
    <label for="profile_image" class="custom-file-btn">
        📷 Choose Profile Picture
    </label>

    <span id="file-name">No image selected</span>

    <input
        type="file"
        id="profile_image"
        name="file"
        accept="image/*"
        onchange="updateFileName(this); if(this.files[0]) preview.src=window.URL.createObjectURL(this.files[0])"
    >
</div>

            <button type="submit">
                Update Profile Picture
            </button>

        </form>
    </div>

</div>

<script>
function updateFileName(input) {
    const fileName = document.getElementById("file-name");

    if (input.files && input.files.length > 0) {
        fileName.textContent = input.files[0].name;
    } else {
        fileName.textContent = "No image selected";
    }
}
</script>

</body>
</html>
