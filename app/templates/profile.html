<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#0f172a;
    color:#e5e7eb;
    font-family:Arial, sans-serif;
    padding:25px 16px;
}

.card{
    width:100%;
    max-width:560px;
    margin:20px auto;
    background:#1e293b;
    padding:32px 24px;
    border-radius:24px;
    border:1px solid #334155;
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
}

/* Profile image */
#preview{
    display:block;
    width:140px;
    height:140px;
    margin:0 auto 25px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #3b82f6;
    box-shadow:0 0 20px rgba(59,130,246,0.35);
}

h2{
    margin:0 0 25px;
    text-align:center;
    font-size:28px;
    color:#f8fafc;
}

/* Form layout */
form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

input[type="text"],
textarea{
    width:100%;
    margin:0;
    background:#0f172a;
    color:#f8fafc;
    border:1px solid #475569;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    outline:none;
    font-family:Arial, sans-serif;
}

input[type="text"]:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

textarea{
    height:110px;
    resize:none;
}

/* Buttons */
button{
    width:100%;
    margin:4px 0 10px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:active{
    transform:scale(0.98);
}

/* File upload */
input[type="file"]{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#0f172a;
    color:#cbd5e1;
    border:1px dashed #475569;
    border-radius:14px;
    font-size:14px;
}

/* Hide unnecessary old line breaks */
br{
    display:none;
}

@media(max-width:480px){
    body{
        padding:16px;
    }

    .card{
        margin:10px auto;
        padding:28px 18px;
        border-radius:20px;
    }

    #preview{
        width:125px;
        height:125px;
    }

    h2{
        font-size:25px;
    }
}

.profile-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-bottom:24px;
    margin-bottom:22px;
    border-bottom:1px solid #334155;
}

.profile-title span{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
    color:#60a5fa;
    margin-bottom:8px;
}

.profile-title h2{
    margin:0;
}

.profile-title p{
    margin:8px 0 0;
    color:#94a3b8;
    font-size:14px;
}

label{
    color:#cbd5e1;
    font-size:13px;
    font-weight:bold;
    margin:4px 0 -4px 4px;
}

.upload-section{
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid #334155;
}

.upload-heading h3{
    margin:0;
    color:#f8fafc;
    font-size:17px;
}

.upload-heading p{
    margin:6px 0 14px;
    color:#94a3b8;
    font-size:13px;
}

.profile-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.profile-nav span{
    font-size:17px;
    font-weight:bold;
    color:#f8fafc;
}

.back-btn{
    width:42px;
    height:42px;
    margin:0;
    padding:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f172a;
    border:1px solid #334155;
    color:#f8fafc;
    font-size:24px;
    line-height:1;
}

.back-btn:active{
    transform:scale(0.92);
    background:#2563eb;
}

.nav-space{
    width:42px;
}

.upload-box{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.upload-box input[type="file"]{
    display:none;
}

.custom-file-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    box-sizing:border-box;
    background:#172033;
    border:1px dashed #475569;
    border-radius:12px;
    color:#cbd5e1;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.custom-file-btn:active{
    transform:scale(0.98);
    border-color:#3b82f6;
    background:#1e293b;
}

#file-name{
    display:block;
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

button:hover{

<body>

<div class="card">

<div class="profile-nav">
    <button type="button" class="back-btn" onclick="history.back()">
        ←
    </button>

    <span>Edit Profile</span>

    <div class="nav-space"></div>
</div>

    <div class="profile-top">
        <img src="{{ user.profile_picture }}" id="preview">

        <div class="profile-title">
            <span>PROFILE</span>
            <h2>{{ user.display_name or user.username }}</h2>
            <p>Manage your personal information</p>
        </div>
    </div>

    <form action="/update-profile" method="post">

        <label>Display Name</label>
        <input
            type="text"
            name="display_name"
            placeholder="Display name"
            value="{{ user.display_name or '' }}"
            maxlength="30">

        <label>Bio</label>
        <textarea
            name="bio"
            placeholder="Write something about yourself..."
            maxlength="150">{{ user.bio or '' }}</textarea>
        <div id="bioCounter" class="profile-helper" style="margin-top:-2px;text-align:right;padding:7px 10px;">0 / 150</div>

        <button type="submit">Save Changes</button>

    </form>

    <div class="upload-section">
        <div class="upload-heading">
            <h3>Profile Picture</h3>
            <p>Choose a new image for your profile</p>
        <div class="profile-helper">
            Images are shown immediately in the preview before upload.
            <span class="profile-limit">Maximum file size: 5 MB</span>
        </div>
        </div>

        <form id="profilePictureForm" action="/upload-profile" method="post" enctype="multipart/form-data">

        <div class="upload-box">
    <label for="profile_image" class="custom-file-btn">
        📷 Choose Profile Picture
    </label>

    <span id="file-name">No image selected</span>

    <input
        type="file"
        id="profile_image"
        name="file"
        accept="image/*"
        onchange="updateFileName(this); if(this.files[0]) preview.src=window.URL.createObjectURL(this.files[0])"
    >
</div>

            <button type="submit">
                Update Profile Picture
            </button>

        </form>
    </div>

</div>

<script>
function updateFileName(input) {
    const fileName = document.getElementById("file-name");

    if (input.files && input.files.length > 0) {
        fileName.textContent = input.files[0].name;
    } else {
        fileName.textContent = "No image selected";
    }
}

(() => {
    const form = document.getElementById("profilePictureForm");
    const fileInput = document.getElementById("profile_image");
    const preview = document.getElementById("preview");
    const submitButton = form?.querySelector('button[type="submit"]');

    if (!form || !fileInput || !submitButton) return;

    let status = document.getElementById("profileUploadStatus");
    if (!status) {
        status = document.createElement("div");
        status.id = "profileUploadStatus";
        status.style.cssText =
            "margin-top:10px;text-align:center;font-size:13px;line-height:1.4;min-height:18px;color:#94a3b8;";
        form.appendChild(status);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = fileInput.files?.[0];
        if (!file) {
            status.textContent = "Please choose a profile picture first.";
            status.style.color = "#fca5a5";
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            status.textContent = "Image is too large. Maximum size is 5 MB.";
            status.style.color = "#fca5a5";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Uploading…";
        submitButton.style.opacity = "0.7";
        status.textContent = "Uploading profile picture…";
        status.style.color = "#94a3b8";

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                credentials: "same-origin",
                cache: "no-store",
                redirect: "follow",
                signal: controller.signal
            });

            const contentType = response.headers.get("content-type") || "";
            if (!contentType.includes("application/json")) {
                throw new Error(
                    "Server returned an unexpected response (HTTP " +
                    response.status + ")."
                );
            }

            const data = await response.json();

            if (!response.ok || !data?.success) {
                throw new Error(
                    data?.error ||
                    "Profile picture upload failed (HTTP " +
                    response.status + ")."
                );
            }

            if (preview && data.profile_picture) {
                preview.src = data.profile_picture;
            }

            status.textContent = "Profile picture updated successfully.";
            status.style.color = "#86efac";

            setTimeout(() => {
                window.location.href = "/profile";
            }, 700);

        } catch (error) {
            status.textContent =
                error?.name === "AbortError"
                    ? "Upload timed out. Please try again."
                    : (error?.message || "Could not update profile picture.");
            status.style.color = "#fca5a5";
        } finally {
            clearTimeout(timeoutId);
            submitButton.disabled = false;
            submitButton.textContent = "Update Profile Picture";
            submitButton.style.opacity = "";
        }
    });
})();
</script>



<script id="lucky-profile-v3-js">
(function(){
    const THEME_KEY = "lucky_setting_darkMode";
    function applyProfileTheme(){
        const dark = localStorage.getItem(THEME_KEY) !== "0";
        document.documentElement.classList.toggle("lucky-light", !dark);
        document.documentElement.dataset.luckyTheme = dark ? "dark" : "light";
    }
    applyProfileTheme();
    window.addEventListener("storage", e => {
        if(e.key === THEME_KEY) applyProfileTheme();
    });
    window.addEventListener("lucky-setting-changed", e => {
        if(e?.detail?.key === "darkMode") applyProfileTheme();
    });

    const bio = document.querySelector('textarea[name="bio"]');
    const counter = document.getElementById("bioCounter");
    function updateBioCount(){
        if(bio && counter) counter.textContent = bio.value.length + " / 150";
    }
    if(bio){
        bio.addEventListener("input", updateBioCount);
        updateBioCount();
    }

    const profileForm = document.querySelector('form[action="/update-profile"]');
    const save = profileForm?.querySelector('button[type="submit"]');
    if(profileForm && save){
        profileForm.addEventListener("submit", () => {
            save.classList.add("profile-save-loading");
            save.textContent = "Saving…";
            save.disabled = true;
        });
    }
})();
</script>
