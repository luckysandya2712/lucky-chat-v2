<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Chat — Encryption Recovery</title>
<style>
*{box-sizing:border-box;font-family:Poppins,Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0f172a,#111827);color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:linear-gradient(160deg,#17253b,#0d1728);border:1px solid rgba(148,163,184,.16);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:22px}p{color:#a9b7ca;font-size:13px;line-height:1.5}
.section{margin-top:20px;padding-top:18px;border-top:1px solid rgba(148,163,184,.12)}
label{display:block;color:#dbeafe;font-size:12px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:#0b1422;color:#fff;outline:none}
button{width:100%;margin-top:10px;padding:13px 14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}
button.secondary{background:#24344e}
.code{display:none;margin-top:12px;padding:14px;border-radius:12px;background:#09111f;border:1px solid rgba(96,165,250,.22);color:#93c5fd;word-break:break-all;font-family:monospace;font-size:13px}
.status{margin-top:12px;min-height:20px;font-size:12px;color:#9fb0c5}
.warning{color:#fbbf24}
</style>
</head>
<body>
<div class="card">
<h1>🔐 Lucky Chat Encryption Recovery</h1>
<p>Create an encrypted backup of your encryption keys, or restore one later. The recovery code itself is never sent to the server.</p>
<div class="section">
<label>Create a recovery backup</label>
<button id="createBtn">Generate recovery code &amp; backup</button>
<div id="generatedCode" class="code"></div>
<p class="warning">Save this recovery code somewhere safe. It is the only way to decrypt the encrypted backup.</p>
</div>
<div class="section">
<label>Restore a backup</label>
<input id="restoreCode" type="password" autocomplete="off" placeholder="Enter recovery code">
<button id="restoreBtn" class="secondary">Restore encryption keys</button>
</div>
<div id="status" class="status"></div>
</div>
<script src="/static/js/crypto.core.js?v=20260927-crypto-recovery-stability-v1"></script>
<script>
const statusEl=document.getElementById("status");
const codeEl=document.getElementById("generatedCode");
const createBtn=document.getElementById("createBtn");
const restoreBtn=document.getElementById("restoreBtn");
const restoreCodeEl=document.getElementById("restoreCode");

const status=(message,warn=false)=>{
  statusEl.textContent=message;
  statusEl.className="status"+(warn?" warning":"");
};

let recoveryBusy=false;

function setRecoveryBusy(busy){
  recoveryBusy=busy;
  createBtn.disabled=busy;
  restoreBtn.disabled=busy;
}

createBtn.addEventListener("click",async()=>{
  if(recoveryBusy) return;

  setRecoveryBusy(true);
  const originalText=createBtn.textContent;
  createBtn.textContent="Creating backup...";

  try{
    if(!window.LuckyCrypto){
      throw new Error("Encryption module is unavailable. Please reload the page.");
    }

    status("Creating encrypted backup...");
    const code=LuckyCrypto.generateRecoveryCode();
    await LuckyCrypto.createRecoveryBackup(code);
    codeEl.style.display="block";
    codeEl.textContent=code;
    status("Backup created. Save the code before leaving this page.");
  }catch(error){
    console.error(error);
    status(error.message||"Could not create backup",true);
  }finally{
    createBtn.textContent=originalText;
    setRecoveryBusy(false);
  }
});

restoreBtn.addEventListener("click",async()=>{
  if(recoveryBusy) return;

  const code=restoreCodeEl.value.trim();
  if(!code){
    status("Enter your recovery code.",true);
    return;
  }

  setRecoveryBusy(true);
  const originalText=restoreBtn.textContent;
  restoreBtn.textContent="Restoring...";

  try{
    if(!window.LuckyCrypto){
      throw new Error("Encryption module is unavailable. Please reload the page.");
    }

    status("Restoring encryption keys...");
    await LuckyCrypto.restoreRecoveryBackup(code);
    status("Keys restored successfully. Reload your chat.");
  }catch(error){
    console.error(error);
    status(error.message||"Could not restore backup",true);
  }finally{
    restoreBtn.textContent=originalText;
    setRecoveryBusy(false);
  }
});
</script>
</body>
</html>
