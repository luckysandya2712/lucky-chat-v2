<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#0b1220">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="/static/pwa/icon-192.png">
<link rel="icon" href="/static/pwa/icon-192.png">

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 50% 20%, rgba(37,99,235,.12), transparent 34%),
        linear-gradient(180deg,#0b1220 0%,#0f172a 55%,#0b1322 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial, sans-serif;
    margin:0;
    padding:24px 16px;
    color:#fff;
}

.card{
    position:relative;
    width:min(100%,420px);
    padding:34px 30px 30px;
    border:1px solid rgba(148,163,184,.14);
    border-radius:26px;
    background:linear-gradient(180deg,rgba(30,41,59,.98),rgba(23,34,54,.98));
    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        0 0 0 1px rgba(59,130,246,.03);
    animation:cardIn .45s ease-out both;
}

.brand{
    text-align:center;
    margin-bottom:28px;
}

.brand-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:70px;
    height:70px;
    margin-bottom:12px;
    border-radius:22px;
    background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(30,64,175,.12));
    border:1px solid rgba(96,165,250,.18);
    box-shadow:0 10px 30px rgba(37,99,235,.12);
    font-size:36px;
}

h1{
    color:#f8fafc;
    text-align:center;
    margin:0;
    font-size:30px;
    letter-spacing:-.7px;
}

.subtitle{
    color:#94a3b8;
    text-align:center;
    margin:8px 0 0;
    font-size:13px;
}

.form-group{
    position:relative;
    margin:14px 0;
}

input{
    width:100%;
    height:54px;
    padding:0 15px;
    border:1px solid rgba(148,163,184,.14);
    border-radius:14px;
    outline:none;
    background:#0f172a;
    color:#f8fafc;
    font-size:16px;
    transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}

input::placeholder{
    color:#64748b;
}

input:focus{
    border-color:rgba(59,130,246,.65);
    background:#111c30;
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
}

.password-group input{
    padding-right:52px;
}

.toggle-password{
    position:absolute;
    right:8px;
    top:7px;
    width:40px;
    height:40px;
    margin:0;
    padding:0;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#94a3b8;
    font-size:18px;
    cursor:pointer;
}

.toggle-password:hover{
    background:rgba(148,163,184,.08);
    color:#e2e8f0;
}

button[type="submit"]{
    width:100%;
    height:54px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(37,99,235,.20);
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}

button[type="submit"]:hover{
    filter:brightness(1.05);
    box-shadow:0 13px 28px rgba(37,99,235,.27);
}

button[type="submit"]:active{
    transform:scale(.985);
}

button[type="submit"]:disabled{
    opacity:.7;
    cursor:not-allowed;
}

p{
    color:#94a3b8;
    text-align:center;
    margin:22px 0 0;
    font-size:13px;
}

a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:600;
}

a:hover{
    text-decoration:underline;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px 0 0;
    color:#475569;
    font-size:10px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:rgba(148,163,184,.10);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(14px) scale(.985);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@media(max-width:430px){
    body{
        padding:18px 12px;
    }

    .card{
        padding:30px 20px 24px;
        border-radius:23px;
    }

    h1{
        font-size:28px;
    }
}

@media(max-height:720px){
    body{
        align-items:flex-start;
        padding-top:28px;
        padding-bottom:28px;
    }
}
</style>

</head>

<body>

<div class="card">

    <div class="brand">
        <div class="brand-icon" aria-hidden="true">🚀</div>
        <h1>Lucky Chat</h1>
        <div class="subtitle">Welcome back 👋</div>
    </div>

    <form method="POST" action="/login" id="loginForm">

        <div class="form-group">
            <input
                type="text"
                name="username"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required>
        </div>

        <div class="form-group password-group">
            <input
                type="password"
                name="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required>
            <button
                class="toggle-password"
                type="button"
                id="togglePassword"
                aria-label="Show password"
                title="Show password">👁️</button>
        </div>

        <button type="submit" id="loginButton">Login</button>
    </form>

    <div class="divider">SECURE LOGIN</div>

    <p>
        Don't have an account?
        <a href="/register">Create one</a>
    </p>

</div>


<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");

togglePassword.addEventListener("click", () => {
    const hidden = passwordInput.type === "password";
    passwordInput.type = hidden ? "text" : "password";
    togglePassword.textContent = hidden ? "🙈" : "👁️";
    togglePassword.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    togglePassword.setAttribute("title", hidden ? "Hide password" : "Show password");
});

loginForm.addEventListener("submit", () => {
    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";
});

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(() => console.log("Lucky Chat PWA Ready"))
            .catch(console.error);
    });
}
</script>

</body>
</html>
