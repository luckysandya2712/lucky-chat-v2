<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lucky Chat</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
height:100vh;
overflow:hidden;
}

.app{
display:flex;
width:100%;
height:100vh;
}

.sidebar{
    width:320px;
    min-width:320px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#111827;
    border-right:1px solid #1f2937;
}

.chat{
flex:1;
background:#0f172a;
display:flex;
flex-direction:column;
}

.logo{
    height:80px;
    display:flex;
    align-items:center;
    padding:0 24px;
    font-size:34px;
    font-weight:700;
    color:#60a5fa;
    border-bottom:1px solid #1f2937;
}

.search{
    padding:20px;
}

.search input{
    width:100%;
    padding:14px 18px;
    background:#1f2937;
    color:white;
    border:none;
    border-radius:14px;
    outline:none;
    font-size:15px;
}

.search input::placeholder{
    color:#94a3b8;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    cursor:pointer;
    transition:.2s;
}

.chat-item:hover{
    background:#1f2937;
}

.chat-item.active{
    background:#2563eb;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#3b82f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    color:white;
}

.chat-info h4{
    color:white;
    font-size:17px;
}

.chat-info p{
    color:#4ade80;
    font-size:13px;
    margin-top:3px;
}

.chat-header{
    height:80px;
    border-bottom:1px solid #1f2937;
    display:flex;
    align-items:center;
    padding:0 25px;
    gap:15px;
    background:#111827;
}

.header-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#3b82f6;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.header-info h3{
    color:white;
    font-size:20px;
}

.header-info p{
    color:#4ade80;
    font-size:13px;
    margin-top:4px;
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.message{
    max-width:70%;
    padding:14px 18px;
    border-radius:18px;
    background:#2563eb;
    color:white;
    font-size:16px;
    word-wrap:break-word;
}

.message.own{
    align-self:flex-end;
}

@media (max-width:768px){

    .sidebar{
        width:40%;
        min-width:150px;
    }

    .logo{
        font-size:16px;
    }

    .chat-header{
        padding:0 15px;
    }

}

</style>

</head>

<body>

<div class="app">

<div class="logo">
    <span>🚀</span>
    <span style="margin-left:12px;">Lucky Chat</span>
</div>

    <div class="search">
        <input
            type="text"
            placeholder="🔍 Search chats">
    </div>

    <div class="chat-list" id="userList">

    </div>

</div>

</body>

</html>
