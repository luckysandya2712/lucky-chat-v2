<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>Lucky Chat — Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(37,99,235,.14),
                    transparent 35%
                ),
                #0b1220;
        }

        .card {
            width: min(100%, 390px);
            padding: 32px 24px;
            text-align: center;
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 24px;
            background: #172238;
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }

        .icon {
            font-size: 44px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #f8fafc;
            font-size: 25px;
        }

        p {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            margin-top: 10px;
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 13px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">🚀</div>

    <h1>You're offline</h1>

    <p>
        Lucky Chat couldn't reach the server.
        Check your connection and try again.
    </p>

    <button onclick="location.reload()">
        Try again
    </button>
</div>

</body>
</html>
